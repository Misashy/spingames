<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les Sims 4 — SimSpin | SpinGames</title>
<meta name="description" content="Ta roue SimSpin originale, tes catégories, tes histoires.">
<link rel="icon" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/platform.css"><link rel="stylesheet" href="../../assets/favorites.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#17102e;color:#fff;font-family:system-ui,sans-serif}
.sg-sims-header{height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;background:#17162c;border-bottom:1px solid #65559d}
.sg-sims-header a{font-weight:800;text-decoration:none;color:#c5ff76;font-size:13px}
.sg-sims-header .sg-account-btn{margin-left:auto}
.sg-sims-frame{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#20123c}
@media(max-width:550px){.sg-sims-header{padding:0 8px}.sg-sims-header a{font-size:11px}}
</style>
<script src="../../assets/site-config.js" defer></script>
<script src="../../assets/cloud-sync.js?v=20261105-private-v2" defer></script><script src="../../assets/platform.js?v=20261105-private-v2" defer></script>
</head><body>
<header class="sg-sims-header"><a href="../../index.html">← SpinGames · Tous les jeux</a></header>
<iframe class="sg-sims-frame" id="sg-sims-frame" src="about:blank" title="SimSpin, roue originale des Sims 4" loading="eager"></iframe>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('sg-sims-frame');
  const source = new URL('index.html', location.href);
  const shim = new URL('../../assets/simspin-storage.js?v=20261105-official-import', location.href);
  let documentTemplate = null, officialCategories = null, loadedFor = undefined, serial = 0;
  const account = () => window.SpinGames?.user?.id || '';
  function storageKey(key, owner = account()) {
    return owner ? 'spingames.account.' + owner + '.' + key : 'spingames.guest.' + key;
  }
  async function showGame(force = false) {
    const owner = account();
    if (!force && owner === loadedFor) return;
    const current = ++serial;
    try {
      if (!documentTemplate) {
        const response = await fetch(source.href, { cache: 'no-cache' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        documentTemplate = await response.text();
      }
      if (!officialCategories) {
        const urls = [1, 2, 3, 4].map(n => new URL('categories-officielles-' + n + '.json', location.href));
        const responses = await Promise.all(urls.map(url => fetch(url, {cache:'no-cache'})));
        if (responses.some(response => !response.ok)) throw new Error('Catégories officielles indisponibles');
        const groups = await Promise.all(responses.map(response => response.json()));
        if (groups.some(group => !Array.isArray(group))) throw new Error('Catégories officielles invalides');
        officialCategories = groups.flat();
      }
      if (current !== serial) return;
      frame.setAttribute('data-sg-uid', owner);
      const officialJSON = JSON.stringify(officialCategories).replace(/</g, '\\u003c');
      const defaults = '<script type="application/json" id="sg-official-categories">' + officialJSON + '<' + '/script>';
      const hideOldReturn = '<style>.devweb-return,.devweb-back{display:none!important}</style>';
      const spinHook = '    const total=results.reduce((sum,r)=>sum+r.items.length,0);';
      const multiAvailable = documentTemplate.includes(spinHook);
      const prepared = multiAvailable
        ? documentTemplate.replace(spinHook, '    window.SimSpinMulti?.spin(included,results);\\n' + spinHook)
        : documentTemplate;
      const multiScript = multiAvailable
        ? '<script src="' + new URL('../../assets/simspin-multi.js?v=20261105-multi1', location.href).href + '"><' + '/script>'
        : '';
      const bootstrap = '<base href="' + source.href + '">' + defaults +
        '<script src="' + shim.href + '"><' + '/script>' + multiScript + hideOldReturn;
      frame.srcdoc = prepared.replace(/<head([^>]*)>/i, (_, attrs) => '<head' + attrs + '>' + bootstrap);
      loadedFor = owner;
    } catch (error) {
      console.warn('Impossible de préparer la session SimSpin', error);
      // Ne jamais retomber sur un stockage partagé si l'isolation a échoué.
      frame.srcdoc = '<!doctype html><html lang="fr"><meta charset="utf-8"><body style="background:#17102e;color:white;font:16px system-ui;padding:32px"><h2>SimSpin momentanément indisponible</h2><p>Recharge cette page pour réessayer sans risquer tes sauvegardes.</p></body></html>';
    }
  }
  window.addEventListener('storage', event => {
    const owner = account();
    const categories = storageKey('simspin.categories.v3', owner);
    const history = storageKey('simspin.history.v4', owner);
    if (!owner || (event.key !== categories && event.key !== history)) return;
    window.SpinGames?.queueSave('les-sims-4');
    if (event.key === history && event.newValue) {
      try {
        const entries = JSON.parse(event.newValue);
        const next = entries[0]?.at || 0;
        if (next > (window.__sgSimsLastSpin || 0)) {
          window.__sgSimsLastSpin = next;
          window.SpinGames?.recordSpin('les-sims-4');
        }
      } catch (_) {}
    }
  });
  frame.addEventListener('load', () => {
    try {
      frame.contentDocument?.querySelectorAll('a,button').forEach(node => {
        if (/retour\\s+[àa]\\s+devwebgames/i.test(node.textContent || '')) node.remove();
      });
    } catch (_) {}
  });
  document.addEventListener('spingames:auth', () => void showGame());
  document.addEventListener('spingames:progress-ready', event => {
    if (event.detail?.slug === 'les-sims-4') void showGame(true);
  });
  void showGame();
})();
</script>
</body></html>
