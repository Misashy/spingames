name: Import DOFUS Clicker sprites
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dofus-clicker/index.html'
      - 'dofus-clicker/game.js'
      - 'dofus-clicker/tools/**'
      - 'dofus-clicker/tests/**'
      - '.github/workflows/dofus-clicker-import.yml'
permissions:
  contents: write
jobs:
  import-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importer les PNG des monstres
        run: python dofus-clicker/tools/import_sprites.py
      - name: Vérifier les données françaises et les transitions du jeu
        run: |
          node --check dofus-clicker/game.js
          node --check dofus-clicker/assets/monsters/catalog.fr.js
          python -m json.tool dofus-clicker/assets/monsters/database.fr.json > /dev/null
          node dofus-clicker/tests/smoke.cjs
          node dofus-clicker/tests/survival.cjs
      - name: Publier uniquement les images de DOFUS Clicker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dofus-clicker/assets/monsters dofus-clicker/assets/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(dofus-clicker): importer les monstres DOFUS"
            git push
          fi
