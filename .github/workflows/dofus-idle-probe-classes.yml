name: Audit portraits classes DOFUS 3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dofus-idle/tools/probe_class_sprites.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyser les images de classes DOFUS
        run: python dofus-idle/tools/probe_class_sprites.py
