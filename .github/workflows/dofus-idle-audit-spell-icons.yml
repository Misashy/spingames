name: Audit des icônes de sorts DOFUS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dofus-idle/tools/audit_spell_icons_v9.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          mkdir -p /tmp/dofus-spells
          base=https://github.com/ledouxm/dofus-sqlite/releases/download/v6.0_3.7.14.18
          curl -fL --retry 3 "$base/images-spell.zip" -o /tmp/dofus-spells/images-spell.zip
          curl -fL --retry 3 "$base/spellsdata.json" -o /tmp/dofus-spells/spellsdata.json
      - run: python dofus-idle/tools/audit_spell_icons_v9.py
