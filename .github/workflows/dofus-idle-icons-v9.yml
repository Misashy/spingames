name: Importer 57 icônes de sorts DOFUS 3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dofus-idle/tools/build_spell_icons_v9.py'
      - '.github/workflows/dofus-idle-icons-v9.yml'
permissions:
  contents: write
concurrency:
  group: dofus-idle-icons-v9
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Télécharger les sprites et traductions
        run: |
          mkdir -p /tmp/dofus-spells
          base=https://github.com/ledouxm/dofus-sqlite/releases/download/v6.0_3.7.14.18
          for file in images-spell.zip spellsdata.json dofus.sqlite; do
            curl -fL --retry 3 "$base/$file" -o "/tmp/dofus-spells/$file"
          done
      - run: python dofus-idle/tools/build_spell_icons_v9.py
      - name: Publier les icônes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dofus-idle/assets/spells
          if ! git diff --cached --quiet; then
            git commit -m "assets(dofus-idle): 57 icônes de sorts DOFUS 3"
            git pull --rebase origin main
            git push
          fi
