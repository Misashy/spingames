name: Importer portraits des 19 classes DOFUS 3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dofus-idle/tools/build_class_portraits.py'
      - '.github/workflows/dofus-idle-class-portraits.yml'
permissions:
  contents: write
concurrency:
  group: dofus-idle-class-portraits
  cancel-in-progress: false
jobs:
  classes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Télécharger les images du client DOFUS 3
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://github.com/ledouxm/dofus-sqlite/releases/download/v6.0_3.7.14.18/images-class.zip \
            -o /tmp/dofus-images-class.zip
      - name: Construire les portraits officiels et les icônes de classe
        run: python dofus-idle/tools/build_class_portraits.py
      - name: Vérifier 19 classes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dofus-idle/assets/classes')
          assets=json.loads((p/'catalog.json').read_text())
          assert len(assets)==19, assets
          assert all((Path('dofus-idle')/v).exists() for v in assets.values())
          print('CLASS PORTRAITS VERIFIED',len(assets))
          PY
      - name: Publier les portraits sans modifier les autres jeux
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dofus-idle/assets/classes
          if ! git diff --cached --quiet; then
            git commit -m "assets(dofus-idle): 19 vrais portraits et emblèmes des classes DOFUS 3"
            git pull --rebase origin main
            git push
          fi
