name: Tester DOFUS IDLE complet sans reimporter les images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dofus-idle/game-full.js'
      - 'dofus-idle/tests/smoke-full.cjs'
      - 'dofus-idle/tests/achievements-full.cjs'
      - 'dofus-idle/index.html'
      - '.github/workflows/dofus-idle-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Installer JSDOM
        run: |
          mkdir -p /tmp/dofus-idle-test
          npm install --prefix /tmp/dofus-idle-test --no-audit --no-fund --no-save jsdom@26
      - name: Vérifier le moteur et les UI
        run: |
          node --check dofus-idle/game-full.js
          node dofus-idle/tests/smoke-full.cjs
          node dofus-idle/tests/achievements-full.cjs
