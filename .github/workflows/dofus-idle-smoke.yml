name: Tester DOFUS IDLE complet sans reimporter les images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dofus-idle/game-full.js'
      - 'dofus-idle/tests/smoke-full.cjs'
      - 'dofus-idle/tests/achievements-full.cjs'
      - 'dofus-idle/tests/bank-character-combat.cjs'
      - 'dofus-idle/tests/equipment-v7.cjs'
      - 'dofus-idle/tests/spells-v8.cjs'
      - 'dofus-idle/tests/adventure-v9.cjs'
      - 'dofus-idle/tests/v10-v12.cjs'
      - 'dofus-idle/tests/v13-v24.cjs'
      - 'dofus-idle/tests/combat-tactics-v13-v14.cjs'
      - 'dofus-idle/tests/craft-only-equipment.cjs'
      - 'dofus-idle/tests/craft-planner.cjs'
      - 'dofus-idle/craft-planner.js'
      - 'dofus-idle/craft-planner.css'
      - 'dofus-idle/combat-tactics-v13-v14.js'
      - 'dofus-idle/combat-tactics-v13-v14.css'
      - 'dofus-idle/expansion-v13-v24.js'
      - 'dofus-idle/expansion-v13-v24.css'
      - 'dofus-idle/cloud-config.js'
      - 'dofus-idle/v10-v12.css'
      - 'dofus-idle/assets/spells/catalog.json'
      - 'dofus-idle/index.html'
      - '.github/workflows/dofus-idle-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Installer JSDOM
        run: |
          mkdir -p /tmp/dofus-idle-test
          npm install --prefix /tmp/dofus-idle-test --no-audit --no-fund --no-save jsdom@26
      - name: Vérifier le moteur et les UI
        run: |
          node --check dofus-idle/game-full.js
          node --check dofus-idle/expansion-v13-v24.js
          node --check dofus-idle/combat-tactics-v13-v14.js
          node --check dofus-idle/craft-planner.js
          node dofus-idle/tests/smoke-full.cjs
          node dofus-idle/tests/achievements-full.cjs
          node dofus-idle/tests/bank-character-combat.cjs
          node dofus-idle/tests/equipment-v7.cjs
          node dofus-idle/tests/spells-v8.cjs
          node dofus-idle/tests/adventure-v9.cjs
          node dofus-idle/tests/v10-v12.cjs
          node dofus-idle/tests/v13-v24.cjs
          node dofus-idle/tests/combat-tactics-v13-v14.cjs
          node dofus-idle/tests/craft-only-equipment.cjs
          node dofus-idle/tests/craft-planner.cjs
